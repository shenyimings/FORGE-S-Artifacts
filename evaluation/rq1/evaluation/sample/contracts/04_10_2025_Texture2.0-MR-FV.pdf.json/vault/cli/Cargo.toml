[package]
name = "vlt"
version = "0.6.0"
edition = "2021"

[dependencies]
vault = { path = "../program", features = ["no-entrypoint"] }
utils = { path = "../utils" }
price-proxy = { workspace = true, features = ["no-entrypoint", "with-serde"] }
price-proxy-client = { workspace = true }
super-lendy = { workspace = true }
texture-common = { workspace = true }

derive_more = { version = "1.0.0", features = ["from", "from_str"] }
dirs-next = "2"
structopt = "0.3.26"
solana-account-decoder = "1.18"
solana-sdk = "1.18"
solana-client = "1.18"
anyhow = "1.0.52"
solana-program = "=1.18.22"
spl-token = { version = "4", features = ["no-entrypoint"] }
spl-token-2022 = { version = "0.6.1", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.1.1", features = ["no-entrypoint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
base64 = "0.21.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
rust_decimal = "1.33.1"
bytemuck = "1.14.0"
uuid = { version = "1.10.0", features = ["v4"] }
hex = "0.4.3"
display_json = "0.2.1"
itertools = "0.13.0"
futures = "0.3.30"
chrono = "0.4.38"
async-recursion = "1.1.1"