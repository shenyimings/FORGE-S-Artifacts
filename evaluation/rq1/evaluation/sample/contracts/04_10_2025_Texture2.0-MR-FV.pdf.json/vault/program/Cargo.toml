[package]
name = "vault"
version = "0.6.2"
edition = "2021"

[features]
custom-heap = []
no-entrypoint = []
test-bpf = ["dep:chrono"]
default = ["custom-heap"]

[dependencies]
borsh = "1.5"
bytemuck = "1.12"
derive_more = "0.99"
num_enum = "0.7"
solana-program = "1.18"
spl-token = "4"
spl-token-2022 = { version = "3", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.1.1", features = ["no-entrypoint"] }
static_assertions = "1.1"
thiserror = "1"
tinyvec = "1.6"

texture-common = { workspace = true }
super-lendy = { workspace = true }
price-proxy = { workspace = true }

chrono = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"]}
serde_json = { version = "1"}
serde_with = { version = "3"}
strum = { version = "0.26.2", features = ["derive"] }
uuid = "1.10.0"

[dev-dependencies]
assert_matches = "1"
lazy_static = "1"
rust_decimal = "1.29.0"
solana-program-test = "1.18"
solana-sdk = "1.18"
# spl-record = "0.1.0"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tarpc = { version = "0.29.0", features = ["full"] }

[lib]
crate-type = ["cdylib", "lib"]
