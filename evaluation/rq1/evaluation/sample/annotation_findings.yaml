  findings:
  - finding_id: 1
    finding_title: Migration applicable to already migrated storage account
    finding_description: '1. **Description:** The `migrate_from_0_1_0` function allows
      the `top_authority` to migrate a legacy `StorageV010` account to the new `Storage`
      layout. However, the function does not prevent re-execution on an already-migrated
      account, as the preliminary checks (e.g., anchor signature match) remain valid
      post-migration.


      2. **Cause:** The migration logic does not change the account''s discriminant
      (as the type name remains the same), and no state flag or size check is used
      to prevent repeated migration. This allows the `top_authority` to re-run the
      migration, reallocating and reinitializing the account.


      3. **Exploitation:** The `top_authority` could re-migrate the account, resetting
      the `treasury` field and potentially corrupting the `trusted_signers` list by
      setting `num_trusted_signers` to an invalid value, which could break signature
      validation logic.


      4. **Impact:** This could lead to governance-level misuse or accidental corruption
      of critical state, such as redirecting fees to a new treasury or breaking oracle
      functionality. While the impact is limited to misuse by the `top_authority`,
      it represents a critical state integrity flaw, rated as Low due to the required
      privileged access.

      '
    finding_files: [lazer/contracts/solana/programs/pyth-lazer-solana-contract/src/lib.rs]
    category:
    - [CWE-664, CWE-372]
