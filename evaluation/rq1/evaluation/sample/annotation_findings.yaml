    finding_description: 'The `offerer_refund` instruction in the SolLightning program
      does not validate the initializer''s account address when refunding funds after
      a failed transfer from Bitcoin to Solana. This allows the intermediary node
      to redirect the refundable fee—intended for the initializer (who is the receiver
      in this case)—to their own account. The vulnerability arises due to the lack
      of an address check against the stored claimer in the escrow state. An attacker
      (intermediary node) can exploit this by initiating a refund after the lock time
      expires and specifying their own account as the recipient of the refundable
      fee, thereby stealing funds from the initializer. The impact is a direct loss
      of funds for the initializer, which qualifies as a high-impact, high-likelihood
      exploit. This issue was later fixed in Revision 2.0 by splitting the instruction
      and enforcing address validation.

      '
