    finding_description: 'The liquidate_sundial_profile instruction rounds up the
      amount of collateral received by the liquidator using a ceiling function, which
      allows an attacker to repeatedly liquidate small amounts of debt and receive
      disproportionately high collateral. The root cause is improper rounding during
      liquidation value calculation, specifically the use of `try_ceil_u64()` on the
      withdraw amount. An attacker can exploit this by depositing high-value collateral
      (e.g., BTC), borrowing low-value tokens (e.g., SOL), and then self-liquidating
      in small increments, each time receiving more value in collateral than repaid.
      This gradually drains the collateral while leaving an undercollateralized loan,
      ultimately leading to a loss of funds for the protocol as the attacker walks
      away with both the borrowed assets and the collateral.

      '
