- filename: Drift Protocol Audit Report.pdf.json
  report_path: reports/Drift Protocol Audit Report.pdf
  contract_path: contracts/Drift Protocol Audit Report.pdf.json
  findings:
  - finding_id: 6
    finding_title: Use of unchecked division operations
    finding_description: 'The functions limit_price_satisfied and asset_to_reserve_amount
      use unchecked division (.div()) instead of safe checked_div(), which could lead
      to silent errors or panics if division by zero occurs. The cause is deviation
      from secure coding practices in Rust, where arithmetic operations should be
      checked in untrusted contexts. Although current preconditions (e.g., non-zero
      denominators) likely prevent actual division by zero, the lack of explicit checks
      makes the code fragile and prone to future bugs if invariants change. An attacker
      might trigger a panic under edge conditions, potentially causing transaction
      failures or denial-of-service in dependent systems. The impact is low, as no
      direct fund loss is possible, but it violates best practices for secure smart
      contract development.

      '
    finding_files: [programs/clearing_house/src/lib.rs]
    category:
    - [CWE-703, CWE-754]
    - [CWE-703, CWE-754]
    - [CWE-703, CWE-754]
