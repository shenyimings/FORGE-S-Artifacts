    - [CWE-284, CWE-269, CWE-266]
    - [CWE-284, CWE-269, CWE-266]
    location: [0, 1, 1, 0]
  - finding_id: 54
    finding_title: Lists are not checked for existence before updating
    finding_description: '1. **Description:** The functions `change_voting_wl_list_id`
      and `change_application_wl_list_id` allow admins to update the whitelist list
      identifiers used for eligibility checks in the protocol. However, these functions
      do not verify that the new list ID corresponds to an existing list.

      2. **Cause:** The root cause is the lack of a validation check to confirm the
      existence of the list associated with the provided list ID before updating the
      configuration.

      3. **Exploitation:** An admin could inadvertently or maliciously set a non-existent
      list ID, which would disrupt eligibility checks that depend on these lists.

      4. **Impact:** This leads to a denial of service, as the protocol will be unable
      to perform proper eligibility checks, potentially blocking legitimate users
      from participating.

      '
