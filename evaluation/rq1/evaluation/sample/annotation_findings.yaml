    finding_title: Unnecessary unconstrained accounts in Request-Withdraw
    finding_description: 'The `RequestWithdraw` instruction includes two accounts,
      `drift_user_stats` and `drift_state`, that are not used within the instruction
      logic. While `drift_user_stats` is constrained and checked via a custom constraint,
      `drift_state` is completely unconstrained and can be any arbitrary account.
      This allows callers to pass a fake or irrelevant `drift_state` account, which
      could confuse off-chain parsers or monitoring tools. Although there is no direct
      security impact, this design choice increases the attack surface slightly and
      reduces instruction clarity. If a future update introduces a CPI that uses these
      accounts without proper validation, it could lead to vulnerabilities. The resolution
      removed `drift_state` and retained `drift_user_stats` for future-proofing with
      updated documentation.

      '
