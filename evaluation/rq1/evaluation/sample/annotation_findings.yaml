  - finding_id: 4
    finding_title: 'Vault Token Accounts: Naming and Seeds'
    finding_description: 'Three types of token accounts are referred to as "vault
      token accounts", with the first two using similar seed prefixes: `[b"vault_token_account",
      vault.key()]` and `[b"vault_token_account", vault.key(), market_index.to_le_bytes()]`.
      Although the probability of a PDA collision is negligible due to the uniqueness
      of the full seeds, the reuse of the same prefix increases the risk of confusion
      and potential future bugs if new account types are added with similar patterns.
      This could lead to incorrect assumptions in client code or during audits. Additionally,
      the naming is ambiguous, making it harder to distinguish between different account
      purposes. While no immediate security impact exists, this could lead to unsafe
      design decisions in future updates. The team acknowledged the finding but chose
      not to change the seeds due to the breaking changes it would require, which
      Neodyme agreed was acceptable given the low severity.

      '
