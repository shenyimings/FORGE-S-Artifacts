    finding_title: EVM-to-Solana Transfers Can Permanently Burn Tokens by Producing a VAA That Solana Cannot Decode
    finding_description: 'The EVM bridge burns tokens and publishes a Wormhole message
      before verifying that the Solana bridge can decode the payload. The EVM encodes
      `_value`, attribute values, and expirations using full 256-bit types and allows
      long strings, but the Solana decoder narrows numeric fields to 64 bits and enforces
      a 1024-byte payload limit. This mismatch allows payloads that are valid on EVM
      but unprocessable on Solana. An attacker can exploit this by sending a transfer
      with a `_value > u64::MAX`, oversized attribute arrays, or long strings that
      cause the encoded payload to exceed 1024 bytes. The EVM will burn the tokens
      and publish the VAA, but Solana will reject it during decoding, causing permanent
      loss of funds on the EVM side.'
    finding_files: []
    category:
    - [CWE-707, CWE-20, CWE-179]
    - [CWE-707, CWE-20, CWE-1284]
    - [CWE-707, CWE-20, CWE-1284]
    location: [0, 0, 0, 1]

  - finding_id: 1
    finding_title: bridge `validate_locked_tokens` diverges from `PolicyEngine` lock semantics and ignores manual locks with `release_time == 0`
    finding_description: 'The Solana bridge reimplements lock validation logic in
      `validate_locked_tokens` but fails to match the canonical `PolicyEngine` semantics.
      Specifically, it only considers manual locks as active if `release_time > current_timestamp`,
      whereas the `PolicyEngine` treats `release_time == 0` as a permanent lock.
      An attacker with a manual lock where `release_time == 0` can trigger a bridge-out
      operation; the bridge will incorrectly validate the transfer as allowed, proceed
      to burn the tokens via CPI to the asset controller, and permanently revoke
      them, bypassing the intended compliance lock.'
    finding_files: []
    category:
    - [CWE-435, CWE-436, CWE-115]
    - [CWE-707, CWE-20, CWE-1289]
    - [CWE-435, CWE-436, CWE-115]
    location: [0, 0, 1, 0]