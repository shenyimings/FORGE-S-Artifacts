  findings:
  - finding_id: 4
    finding_title: Merk trunk splitting can lead to panics on degenerate trees
    finding_description: 'Syncing nodes will panic if the Merk AVL tree is highly
      skewed and the trunk is not a perfect binary tree. The root cause is an assumption
      in the code that all trunks are perfect binary trees, combined with an off-by-one
      error that fails to account for valid but incomplete trunks at truncation height.
      The assertion `assert_eq!(self.remaining_chunks_unchecked(), chunks_remaining)`
      fails in such cases. Although this requires a maliciously crafted sequence of
      key insertions, it could still be exploited to crash all syncing nodes. The
      impact is a denial of service, especially under adversarial conditions, despite
      the low practical exploitability.

      '
    finding_files: [src/merk/snapshot.rs]
    category:
    - [CWE-682, CWE-193]
