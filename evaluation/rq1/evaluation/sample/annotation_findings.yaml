- filename: VAR_Malda_250120_malda_zkcoprocessor_V7.pdf.json
  report_path: reports/VAR_Malda_250120_malda_zkcoprocessor_V7.pdf
  contract_path: contracts/VAR_Malda_250120_malda_zkcoprocessor_V7.pdf.json
  findings:
  - finding_id: 20
    finding_title: Fraudulent games may DoS the slow lane
    finding_description: 'The function validate_opstack_env_with_l1_inclusion() retrieves
      the latest dispute game index from the Dispute Game Factory and assumes it corresponds
      to the block being validated. However, this approach is vulnerable to spam attacks
      where an attacker creates numerous spurious games, shifting the latest index
      away from the legitimate game.


      The root cause is the reliance on the latest game index without validating its
      relevance to the target block. The function does not accept a specific game
      index as input, making it susceptible to index manipulation.


      An attacker could exploit this by flooding the Dispute Game Factory with fake
      games, causing the slow lane to fetch an incorrect or non-existent game, leading
      to proof validation failure.


      The impact is a denial-of-service condition where legitimate users cannot generate
      proofs because the system cannot locate the correct dispute game, forcing reliance
      on the Malda sequencer.

      '
    finding_files: [malda_utils/src/validators.rs]
    category:
    - [CWE-707, CWE-20, CWE-1288]
    - [CWE-707, CWE-20, CWE-1288]
    - [CWE-707, CWE-20, CWE-1288]
    location: [1, 0, 0, 0]
  - finding_id: 1
    finding_title: Balance queries performed on incorrect addresses due to padding
    finding_description: 'In the `validate_balance_of_call()` function, an unnecessary
      12-byte padding is added when constructing EVM call data for balance queries.
      The account address is already left-padded to 32 bytes when converted via `into_word()`,
      so the additional padding shifts the actual address bytes, resulting in a corrupted
      call data structure. This causes the balance query to be executed on an incorrect
      address, leading to a return value of zero or invalid state.

      The root cause is redundant manual padding in the call data construction logic.
      An attacker could potentially exploit this by crafting inputs that amplify the
      effect of incorrect address resolution, although the primary impact is on legitimate
      users. The impact is that users cannot reliably use the cross-chain functionality,
      as balance checks will fail or return incorrect results, effectively breaking
      core protocol operations.

      '
    finding_files: [malda_rs/src/viewcalls.rs]
    category:
    - [CWE-682]
    - [CWE-682]
    - [CWE-682]
    location: [1, 0, 0, 0]
