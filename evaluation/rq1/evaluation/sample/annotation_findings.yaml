- filename: light_protocol_audit_final.pdf.json
  report_path: reports/light_protocol_audit_final.pdf
  contract_path: contracts/light_protocol_audit_final.pdf.json
  findings:
  - finding_id: 5
    finding_title: Failure to Update Canopy Nodes
    finding_description: 'The `update` function in `ConcurrentMerkleTree` fails to
      update canopy nodes when altering tree nodes, resulting in discrepancies during
      proof generation involving the canopy. This occurs because canopy updates are
      not synchronized with internal node updates. An attacker could exploit this
      by generating invalid proofs that appear valid due to outdated canopy data.
      The impact includes compromised proof integrity and potential bypass of security
      checks that rely on up-to-date Merkle proofs. The `update` function is responsible
      for updating a leaf node and ensuring the associated proof remains valid, but
      it does not include functionality to update the canopy nodes when a leaf node
      is modified. In Merkle trees, canopy nodes are a subset of nodes used in proof
      generation but not part of the main tree structure. These nodes are critical
      for computing intermediate hashes during proof validation. If canopy nodes are
      not updated in sync with the main tree, the generated proofs will include outdated
      or incorrect canopy node hashes, resulting in subsequent proof validation failing,
      potentially disrupting system integrity and availability.

      '
    finding_files: [merkle-tree/concurrent/src/lib.rs]
    category:
    - [CWE-664, CWE-662]
    - [CWE-664, CWE-662]
    - [CWE-693, CWE-345, CWE-347]
    location: [1, 0, 0, 0]
  - finding_id: 29
    finding_title: Redundant load_merkle_tree_mut Call in process_initialize_address_merkle_tree
    finding_description: '1. **Description:** The function `process_initialize_address_merkle_tree`
      calls `load_merkle_tree_mut` after `load_merkle_tree_init`, which is redundant
      because the latter already initializes the mutable state.

      2. **Cause:** Poor code structure leads to unnecessary reloading of the same
      account state.

      3. **Exploitation:** While not directly exploitable, it increases compute usage
      and attack surface due to unnecessary operations.

      4. **Impact:** Wasted compute units, increased transaction costs, and reduced
      efficiency.

      '
    finding_files: [programs/account-compression/src/processor/initialize_address_merkle_tree.rs]
    category:
    - [CWE-710, CWE-1041]
    - [CWE-710, CWE-1164]
    - [CWE-710, CWE-1164]
    location: [1, 0, 0, 0]
  - finding_id: 2
    finding_title: Changelog Path Update Error
    finding_description: 'In the `append_batch` function of `ConcurrentMerkleTree`,
      the last iteration of the loop erroneously includes an extra node during changelog
      path updates. This is caused by an off-by-one error in the loop logic that updates
      the Merkle tree structure. Specifically, the `fillup_index` is calculated using
      `self.next_index.trailing_ones() as usize + 1`, which includes the leaf node
      in the Merkle path computation. However, during the loop that updates the `changelog`
      paths, the condition `if i < self.height - 1` attempts to update path entries
      even for the last node. This inconsistency causes the last node (leaf) to be
      incorrectly included in the path update, leading to invalid or corrupted Merkle
      proofs stored in the changelog. An attacker could exploit this by triggering
      batch appends that corrupt the Merkle tree''s changelog, leading to inconsistent
      or invalid state transitions. The impact includes incorrect proof generation
      and potential disruption of state synchronization, undermining the integrity
      of the system.

      '
    finding_files: [merkle-tree/concurrent/src/lib.rs]
    category:
    - [CWE-682, CWE-193]
    - [CWE-682, CWE-193]
    - [CWE-682, CWE-193]
    location: [1, 0, 0, 0]
