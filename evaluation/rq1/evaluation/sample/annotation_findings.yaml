- filename: zenith-damm-v2-audit-dec-2025.pdf.json
  report_path: reports/zenith-damm-v2-audit-dec-2025.pdf
  contract_path: contracts/zenith-damm-v2-audit-dec-2025.pdf.json
  findings:
  - finding_id: 4
    finding_title: validate() for Market Cap Scheduler should enforce number_of_period
      > 0
    finding_description: 'The `validate()` function in the Market Cap Scheduler checks
      several parameters such as `reduction_factor`, `price_step_bps`, and `scheduler_expiration_duration`
      for being greater than zero, but omits validation for `number_of_period > 0`.
      This allows initialization of a scheduler with `number_of_period = 0`, effectively
      creating a ''zero'' scheduler that never reduces the base fee. The root cause
      is incomplete input validation. While not directly exploitable, this could lead
      to misconfigured pools where fee decay logic is unintentionally disabled. The
      impact is operational—deviating from intended economic behavior—and could mislead
      users about fee dynamics, reducing trust in the system''s predictability.

      '
    finding_files: [programs/cp-amm/src/base_fee/fee_market_cap_scheduler.rs]
    category:
    - [CWE-707, CWE-20, CWE-1284]
    - [CWE-707, CWE-20, CWE-1284]
    - [CWE-707, CWE-20, CWE-1284]
    location: [1, 0, 0, 0]
  - finding_id: 2
    finding_title: MarketCapScheduler's fee decay will be slower than expected due
      to wrong unit for price_step_bps
    finding_description: 'The `MarketCapScheduler` calculates fee decay based on changes
      in sqrt_price but interprets the `price_step_bps` parameter as if it were in
      regular price BPS, not sqrt_price BPS. Since sqrt_price changes are non-linear
      relative to price changes, this leads to incorrect period calculations—especially
      during large price movements. For example, a 100% price increase results in
      only a ~41.42% increase in sqrt_price, causing fewer decay periods to be counted
      than expected. The root cause is a unit mismatch in the configuration parameter.
      This leads to slower-than-intended fee decay, affecting the economic model by
      keeping fees higher for longer. While not directly exploitable for fund theft,
      it distorts intended market dynamics and fee revenue distribution.

      '
    finding_files: [programs/cp-amm/src/base_fee/fee_market_cap_scheduler.rs]
    category:
    - [CWE-682, CWE-1339]
    - [CWE-682, CWE-1339]
    - [CWE-682, CWE-1339]
    location: [1, 0, 0, 0]
- filename: 2025-02-28.pdf.json
  report_path: reports/2025-02-28.pdf
  contract_path: contracts/2025-02-28.pdf.json
  findings:
  - finding_id: 1
    finding_title: Set mint freeze authority if token based locking will be supported
    finding_description: 'The current implementation sets the freeze authority to
      None when initializing a position mint for non-Token2022 positions. This decision
      prevents the possibility of supporting token-based locking in the future, as
      the freeze authority cannot be re-assigned once set to None.


      The cause is the use of Anchor''s mint::authority syntax in the open_position
      instruction, which results in the freeze authority being set to None by default
      in the token program. This behavior is inherited from the SPL Token program''s
      process_initialize_mint2 logic.


      If the project later decides to support locking for standard token-based positions,
      it would be impossible to freeze those accounts due to the missing freeze authority.
      This limits future extensibility and creates a permanent divergence between
      lockable (Token2022) and non-lockable (standard token) positions.


      The impact is a loss of design flexibility. While the team has decided to limit
      locking to Token2022-based positions, this decision permanently excludes older
      or non-extended token positions from future locking mechanisms, potentially
      fragmenting user experience or limiting upgrade paths.

      '
    finding_files: [programs/whirlpool/src/instructions/open_position.rs]
    category:
    - [CWE-693]
    - [CWE-284, CWE-285, CWE-863]
    - [CWE-284, CWE-285, CWE-863]
    location: [1, 0, 0, 0]
