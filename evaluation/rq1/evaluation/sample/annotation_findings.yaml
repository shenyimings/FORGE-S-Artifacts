- filename: 2025-01-pump-science.md.json
  report_path: reports/2025-01-pump-science.md
  contract_path: contracts/2025-01-pump-science.md.json
  findings:
  - finding_id: 4
    finding_title: '[M-03] Abrupt fee transition from 8.76% to 1% at slot 250 due
      to incorrect linear decrease formula'
    finding_description: 'The fee calculation function uses a linear decrease formula
      in Phase 2 (slots 150–250) that fails to smoothly transition to the fixed 1%
      fee in Phase 3. At slot 250, the calculated fee is 8.76%, but at slot 251, it
      abruptly drops to 1%, creating a 7.76% discontinuity. The root cause is incorrect
      calibration of the linear formula coefficients (-8,300,000 and 2,162,600,000),
      which do not ensure the fee reaches exactly 1% at slot 250. An attacker could
      time transactions around slot 250 to exploit the sudden fee drop, paying significantly
      less in fees than intended. The impact is an economic inconsistency that distorts
      user incentives and undermines the protocol''s fee model, potentially leading
      to revenue loss and user distrust.

      '
    finding_files: [programs/pump-science/src/state/bonding_curve/curve.rs]
    category:
    - [CWE-682]
    - [CWE-682]
    - [CWE-682]
    location: [1, 0, 0, 0]
