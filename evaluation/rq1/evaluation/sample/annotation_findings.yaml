  - finding_id: 5
    finding_title: Users can lose rewards when settlement blocks exceed maximum capacity
    finding_description: 'The reward settlement system limits storage to 64 settlement
      blocks. When exceeded, the oldest block is cleared and its amount moved to remaining_amount,
      but user_update_reward_pools does not credit settled amounts from force-cleared
      blocks to total_settled_amount. The root cause is incomplete state transition
      logic during block rotation. Users who do not update within 64 blocks lose access
