    finding_title: Unnecessary call in MintTo Instruction
    finding_description: 'The MintTo instruction redundantly calls Vault::find_program_address
      to derive the vault''s PDA, even though the seeds are already known and can
      be used directly.


      The root cause is inefficient code design that performs unnecessary cryptographic
      computations, increasing compute unit usage.


      While not directly exploitable, an attacker could leverage this inefficiency
      in a resource exhaustion attack by repeatedly calling the instruction to increase
      transaction costs.


      The impact is increased computational overhead and higher transaction fees,
