      restaking vaults). The root cause is an off-by-one miscalculation in capacity
      estimation. When the 34th item is added, the vector reallocates, causing unnecessary
      memory copying. The impact is increased compute cost and inefficiency, which
      could contribute to transaction failures under tight compute limits.

