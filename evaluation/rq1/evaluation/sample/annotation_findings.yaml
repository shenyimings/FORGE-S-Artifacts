- filename: VAR_MoonBite_240103_OfficialR.pdf.json
  report_path: reports/VAR_MoonBite_240103_OfficialR.pdf
  contract_path: contracts/VAR_MoonBite_240103_OfficialR.pdf.json
  findings:
  - finding_id: 6
    finding_title: Any user can DoS important functionality of the stake contract
    finding_description: 'The create_distribution_flow function in the stake contract
      lacks access control, allowing any user to create new distributions. Other critical
      functions like bond and distribute_rewards iterate over all distributions in
      a loop. As the number of distributions grows unbounded, these operations become
      increasingly gas-intensive and may eventually exceed transaction limits. A malicious
      user can exploit this by creating a large number of distributions, causing a
      denial of service for legitimate users trying to interact with the staking system.

      '
    finding_files: [contracts/stake/src/contract.rs]
    category:
    - [CWE-284, CWE-285, CWE-862]
    - [CWE-284, CWE-285, CWE-862]
    - [CWE-284, CWE-285, CWE-862]
    location: [1, 0, 0, 0]
  - finding_id: 2
    finding_title: Unbounded instance storage
    finding_description: 'The factory contract uses instance storage to maintain a
      growing list of liquidity pools via save_lp_vec and save_lp_vec_with_tuple_as_key.
      Instance storage in Soroban has strict size limitations and becomes increasingly
      expensive as it grows. Since the number of pools is unbounded, the storage can
      eventually reach the network''s per-transaction limit (130 KB), preventing the
      creation of new pools. This creates a denial-of-service condition where the
      factory becomes unusable after a certain number of deployments, undermining
      the system''s scalability.

      '
    finding_files: [contracts/factory/src/storage.rs]
    category:
    - [CWE-664, CWE-400, CWE-770]
    - [CWE-664, CWE-400, CWE-770]
    - [CWE-664, CWE-400, CWE-770]
    location: [1, 0, 0, 0]
  - finding_id: 29
    finding_title: Curve combinations become increasingly expensive
    finding_description: 'In the `fund_distribution` function, reward curves are combined
      using a `combine` method that retains all historical points, leading to quadratic
      time complexity (O(n²)) due to bubble sort in the curve package. As more distributions
      are funded, the curve grows indefinitely, increasing both computation cost and
      storage overhead. The root cause is the lack of pruning logic to remove expired
      or irrelevant curve points. An attacker could exploit this by repeatedly funding
      small distributions, forcing the contract to process increasingly large curves,
      eventually making `fund_distribution` or related functions uneconomical to call.
      The impact is a potential denial-of-service via resource exhaustion, threatening
      the long-term sustainability of the staking mechanism.

      '
    finding_files: [contracts/stake/src/contract.rs]
    category:
    - [CWE-664, CWE-400, CWE-770]
    - [CWE-664, CWE-400, CWE-770]
    - [CWE-664, CWE-400, CWE-770]
    location: [1, 0, 0, 0]
  - finding_id: 34
    finding_title: Unnecessary referral unwrapping
    finding_description: 'The `swap` function in the multihop contract unnecessarily
      clones and pattern-matches on the `referral` optional parameter, duplicating
      the `lp_client.swap` call in both `if` and `else` branches. This redundancy
      increases code size and complexity without benefit, as the `referral` option
      can be passed directly. The root cause is suboptimal use of Rust''s ownership
      and option handling. While not a security flaw, it harms code maintainability
      and increases the risk of divergence between the two branches if one is updated
      and the other is not. The impact is primarily on code quality and long-term
      sustainability, making audits and modifications more difficult.

      '
    finding_files: [contracts/multihop/src/contract.rs]
