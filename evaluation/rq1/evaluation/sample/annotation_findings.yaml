- filename: VAR_57_blocks_240709_timelock_contract.pdf.json
  report_path: reports/VAR_57_blocks_240709_timelock_contract.pdf
  contract_path: contracts/VAR_57_blocks_240709_timelock_contract.pdf.json
  findings:
  - finding_id: 0
    finding_title: Centralization Risk
    finding_description: 'The vulnerability lies in the inability to fully decentralize
      administrative control of the timelock contract. Unlike the OpenZeppelin TimelockController
      design, which allows the admin to renounce their role and enforce governance
      through timelocked proposals, this implementation does not support such a mechanism.
      The root cause is the lack of functionality to schedule administrative operations
      (like grant_role, revoke_role, update_min_delay, and update_owner) as timelocked
      actions. As a result, the Owner retains permanent control, creating a centralization
      risk. An attacker who compromises the Owner''s private keys could indefinitely
      control all privileged operations. The impact is a single point of failure and
      reduced trust in the system’s decentralization, potentially leading to unilateral
      changes without community oversight.

      '
    finding_files: [time_lock/src/contract.rs]
    category:
    - [CWE-284, CWE-269]
    - [CWE-284, CWE-269]
    - [CWE-284, CWE-269]
    location: [1, 0, 0, 0]
- filename: 2024-11-mantra-dex.md.json
  report_path: reports/2024-11-mantra-dex.md
  contract_path: contracts/2024-11-mantra-dex.md.json
  findings:
  - finding_id: 33
    finding_title: Reduced Newton-Raphson iterations easily leads to slightly incorrect
      results due to potential precision loss
    finding_description: 'The implementation reduces Newton-Raphson iterations from
      256 (Curve''s standard) to 32, which may lead to insufficient convergence in
      extreme cases. The root cause is the assumption that fewer iterations are sufficient,
      despite potential for high pool imbalance or large trades. An attacker could
      exploit this by creating highly imbalanced pools where the approximation fails
      to converge, resulting in incorrect D or y values. The impact is slightly incorrect
      pricing, unfair trades, and potential failure of arbitrage, undermining economic
      efficiency.

      '
    finding_files: [contracts/pool-manager/src/helpers.rs]
    category:
    - [CWE-682, CWE-1339]
    - [CWE-682, CWE-1339]
    - [CWE-682, CWE-1339]
    location: [1, 0, 0, 0]
  - finding_id: 14
    finding_title: Penalty fees can be shared among future farms or expired farms,
      risks of exploits
    finding_description: 'The `withdraw_position` function distributes penalty fees
      from emergency withdrawals equally among all farm owners with the same `lp_denom`,
      regardless of whether the farm is active, expired, or in the future. This allows
      a malicious actor to create a future farm with a popular LP token and receive
      a share of penalty fees before the farm ever becomes active. The attacker can
      then close the farm and withdraw all assets, profiting from penalty fees without
      contributing to the ecosystem. This reduces the rewards for legitimate, active
      farm operators and enables exploitation through low-effort, high-reward attacks
      on the fee distribution mechanism.

      '
    finding_files: [contracts/farm-manager/src/position/commands.rs, contracts/farm-manager/src/state.rs]
    category:
    - [CWE-664, CWE-666]
    - [CWE-664, CWE-666]
    - [CWE-664, CWE-666]
    location: [2, 0, 0, 0]
  - finding_id: 3
    finding_title: Block gas limit can be hit due to loop depth
    finding_description: 'The function in question contains a loop that can be manipulated
      to execute an excessive number of iterations based on user-controlled input,
      potentially exceeding the block gas limit and causing the transaction to fail
      or block the network. The root cause is the lack of bounds checking or limits
      on the loop iteration count, which depends on dynamic data such as the number
      of reward epochs or positions. An attacker could exploit this by creating a
      farm with a large number of epochs or by manipulating the state to trigger a
      deep loop during critical operations like reward distribution or position updates.
      This would result in a denial of service, as legitimate transactions would be
      unable to execute due to gas exhaustion. The impact is high due to the potential
      for network-level disruption and blocking of essential contract functions.

      '
    finding_files: [contracts/farm-manager/src/farm/commands.rs]
    category:
    - [CWE-691, CWE-834]
    - [CWE-691, CWE-834]
    - [CWE-691, CWE-834]
    location: [1, 0, 0, 0]
  - finding_id: 11
    finding_title: Stableswap does disjoint swaps, breaking the underlying invariant
    finding_description: 'The vulnerability stems from the stableswap implementation
      calculating the invariant using only the ask and offer token amounts, ignoring
      other tokens in the pool. This breaks the fundamental stableswap invariant,
      which should consider all token balances to maintain price stability across
      the entire pool.


      The root cause is in the compute_swap and calculate_stableswap_y functions,
      where only the two involved tokens are used in the sum and product calculations
      for the invariant (S and D), despite the pool having more than two tokens. This
      is in contrast to standard implementations like Curve, which include all token
      balances.


      An attacker can exploit this by performing swaps between two tokens while ignoring
      the state of other tokens in the pool. For example, in a three-token pool (A,
      B, C), A-B swaps do not consider the balance of C, allowing arbitrage opportunities
      when C is imbalanced. This leads to worse slippage profiles and increased manipulability.


      The impact is degraded economic security of the pool, with increased vulnerability
      to arbitrage and manipulation. Users suffer from worse swap prices, and the
      pool''s ability to maintain stable prices across all assets is compromised,
      undermining the core value proposition of stableswap pools.

      '
    finding_files: [contracts/pool-manager/src/helpers.rs]
    category:
    - [CWE-682]
    - [CWE-682]
    - [CWE-682]
    location: [1, 0, 0, 0]
- filename: Convergence%20Audit%20Report.pdf.json
  report_path: reports/Convergence%20Audit%20Report.pdf
  contract_path: contracts/Convergence%20Audit%20Report.pdf.json
  findings:
  - finding_id: 6
    finding_title: Taker Can Cancel RFQs With Responses
    finding_description: 'The `cancel_access_control` function does not enforce the
      documented requirement that an RFQ must have no responses before cancellation.
      Although the docstring states this condition, the code omits a check for `best_bid_amount.is_none()`
      and `best_ask_amount.is_none()`. This allows a taker to cancel an RFQ after
      receiving responses, preventing makers from settling and potentially leading
      to fund lockup. The impact is a partial denial of service for makers and undermines
      the fairness of the RFQ lifecycle.

      '
    finding_files: [programs/rfq/src/access_controls.rs]
    category:
    - [CWE-664, CWE-666]
    - [CWE-691, CWE-696]
    - [CWE-691, CWE-696]
    location: [1, 0, 0, 0]
