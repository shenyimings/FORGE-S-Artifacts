    finding_title: Deposit Tokens Transferred from Depositor Token Account Instead
      of Signer
    finding_description: '1. **Description:** The deposit function in the SpokePool
      program incorrectly uses the depositor''s token account as the source for token
      transfers when the signer (caller) is not the depositor. This undermines the
      intended functionality of allowing third-party deposits and introduces a potential
      fund theft vector.

      2. **Cause:** The root cause is the use of the depositor''s token account as
      the source in the `transfer_from` call without validating that the signer owns
      or controls that account. The state PDA is used as the signer in the transfer,
      which can be exploited if a token account has delegated funds to it.

      3. **Exploitation:** An attacker could exploit this by convincing a user to
      delegate their token account to the state PDA (or intercepting a transaction
      where this happens), then calling the deposit function with the victim''s token
      account as the source and the attacker''s address as the recipient, thereby
      stealing funds.

      4. **Impact:** The impact includes loss of user funds due to unauthorized transfers
      and the disabling of legitimate third-party deposit functionality, reducing
      the usability and security of the protocol.

      '
    finding_files: [programs/svm-spoke/src/instructions/deposit.rs]
