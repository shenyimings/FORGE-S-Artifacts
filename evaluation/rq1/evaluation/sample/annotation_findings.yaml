- filename: Guessmeme Rust Contracts Audit Report - QuillAudits.pdf.json
  report_path: reports/Guessmeme Rust Contracts Audit Report - QuillAudits.pdf
  contract_path: contracts/Guessmeme Rust Contracts Audit Report - QuillAudits.pdf.json
  findings:
  - finding_id: 1
    finding_title: 'Zero Token Withdrawal Risk: Complete Status Only Triggered After
      Last Token Sale'
    finding_description: '1. **Description:** The bonding curve''s "complete" status,
      which enables the withdraw function, is only triggered when the last token is
      sold. However, once all tokens are sold, there are no tokens left to withdraw
      alongside SOL, rendering the withdrawal of remaining tokens impossible.

      2. **Cause:** The logic ties completion strictly to the exhaustion of token
      reserves (real_token_reserves = 0), without preserving a portion of tokens for
      withdrawal by the admin.

      3. **Exploitation:** While not directly exploitable by attackers, this design
      flaw can be triggered naturally if all tokens are sold, leading to an inconsistent
      state where withdrawal is enabled but tokens to withdraw no longer exist.

      4. **Impact:** The admin cannot withdraw leftover tokens, leading to loss of
      expected assets and reduced transparency in fund management.

      '
    finding_files: [Solana/lib.rs]
    category:
    - [CWE-691, CWE-670]
    - [CWE-691, CWE-670]
    - [CWE-691, CWE-670]
    location: [1, 0, 0, 0]
- filename: 2021-08-03-neodyme.pdf.json
  report_path: reports/2021-08-03-neodyme.pdf
  contract_path: contracts/2021-08-03-neodyme.pdf.json
  findings:
  - finding_id: 3
    finding_title: Deletion of Rewards with Possible Economic Attack
    finding_description: '1. **Description:** An attacker can exploit the timing of
      exchange rate updates at epoch boundaries to manipulate the stSOL value and
      profit from shorting.

      2. **Cause:** The exchange rate is updated only once after each epoch begins,
      creating a window where deposits use outdated rates.

      3. **Exploitation:** The attacker accumulates stSOL before an epoch boundary,
      withdraws stake just before the boundary, re-deposits immediately after using
      the old rate, and effectively doubles their stSOL exposure. By shorting stSOL
      beforehand, they profit when the market price drops post-attack.

      4. **Impact:** Economic loss to the protocol and stSOL holders due to artificial
      inflation and subsequent devaluation, enabling profit via market manipulation.

      '
    finding_files: [program/src/processor.rs]
    category:
    - [CWE-691]
    - [CWE-691, CWE-662, CWE-362, CWE-367]
    - [CWE-691, CWE-662, CWE-362, CWE-367]
    location: [1, 0, 0, 0]
