- filename: solana_attestation_service_audit_final.pdf.json
  report_path: reports/solana_attestation_service_audit_final.pdf
  contract_path: contracts/solana_attestation_service_audit_final.pdf.json
  findings:
  - finding_id: 0
    finding_title: Re-utilization of Attestation Account
    finding_description: 'The vulnerability arises when a closed attestation account
      is re-utilized with the same nonce and account. In this scenario, the verify_system_account
      check in process_create_attestation fails because the expected token account
      cannot be initialized, as it already exists. The root cause is the assumption
      that the token account does not exist during re-initialization, without proper
      handling for cases where it has been previously created and closed. An attacker
      could exploit this by closing and reusing an attestation account with the same
      parameters, causing the instruction to fail unexpectedly. The impact is a denial
      of service for legitimate users attempting to reuse such accounts, disrupting
      normal functionality.

      '
    finding_files: [program/src/processor/create_attestation.rs]
