    finding_title: Unsafe Handling of Mint in WithdrawAssets Instruction
    finding_description: 'The WithdrawAssets instruction accepts the mint as a Pubkey
      in the instruction data rather than as a validated account in the accounts vector.
      This design bypasses standard Solana account validation mechanisms, allowing
      a caller to pass a non-existent or invalid mint.


      The root cause is the failure to validate the mint account via the runtime,
      which allows unverified data to influence program logic. Without account validation,
      the program cannot ensure the mint is a real, initialized token mint.


      An attacker could exploit this by passing a fake or invalid mint Pubkey, potentially
      causing the program to miscalculate withdrawal amounts or interact with non-existent
      accounts, leading to errors or inconsistent state.


      The impact includes potential loss of funds or incorrect asset handling due
      to reliance on unverified mint data. While the risk is mitigated by other checks,
      the flaw introduces unnecessary attack surface and logic vulnerabilities.

      '
    finding_files: [restaking_program/src/lib.rs]
