    finding_title: Admins can maliciously redirect project payout funds
    finding_description: 'The update_project() function allows project admins to change
      the payout_address, which determines where project funds are sent. The root
      cause is excessive permissions granted to admins who may not be as trusted as
      the project owner. A malicious admin could update the payout address to their
      own wallet and steal future payouts. Although the impact is limited to the project
      level, it represents a significant financial risk if exploited. The issue was
      resolved by removing the payout_address field entirely.

      '
