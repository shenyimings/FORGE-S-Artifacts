    finding_description: 'In the remove_liquidity instruction, the code does not return
      an error when lp_mint.supply exceeds liq_pool.lp_supply, despite a comment indicating
      that an error should be returned. The root cause is incomplete error handling
      implementation. This inconsistency could allow unauthorized LP token minting
      to go undetected, unlike in add_liquidity which properly enforces this check.
      The impact is reduced security assurance and potential for undetected token
      supply inflation.

