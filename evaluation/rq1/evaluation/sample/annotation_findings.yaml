- filename: mango_v4_audit_final.pdf.json
  report_path: reports/mango_v4_audit_final.pdf
  contract_path: contracts/mango_v4_audit_final.pdf.json
  findings:
  - finding_id: 0
    finding_title: Inadequate Access Control Inside HealthRegions
    finding_description: '1. **Description:** The HealthRegion feature allows multiple
      instructions to be executed without performing health checks, as long as the
      account ends in a healthy state. However, this introduces a security risk where
      an attacker can borrow tokens, create bad debt, and immediately liquidate it
      within the same transaction, effectively stealing funds from the protocol.


      2. **Cause:** The root cause is the lack of access control within HealthRegion,
      which permits operations like withdrawals and liquidations without intermediate
      health checks. This allows malicious actors to exploit the system by manipulating
      account states during the transaction.


      3. **Exploitation:** An attacker can initiate a HealthRegion, withdraw tokens
      to create an unhealthy account state, then use the TokenLiqBankruptcy instruction
      to liquidate the bad debt. Since the liquidation occurs within the same transaction,
      the protocol covers the loss, enabling the attacker to extract tokens without
      repayment.


      4. **Impact:** A successful exploit leads to unauthorized appropriation of funds
      from the protocol''s banks, resulting in direct financial loss. This undermines
