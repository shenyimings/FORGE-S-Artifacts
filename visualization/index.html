<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solana Security — Visualizations</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0e14;
      color: #e6e6e6;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      text-align: center;
    }

    .sub {
      color: #8a93a6;
      font-size: 0.95rem;
      margin-top: -1.5rem;
      text-align: center;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.card {
      display: block;
      width: 260px;
      padding: 1.75rem;
      border-radius: 14px;
      background: #141925;
      border: 1px solid #232a3a;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease;
    }

    a.card:hover {
      transform: translateY(-4px);
      border-color: #4c7dff;
    }

    a.card h2 {
      margin: 0 0 .5rem;
      font-size: 1.15rem;
    }

    a.card p {
      margin: 0;
      color: #8a93a6;
      font-size: .9rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <h1>How Secure is Solana? — Visualizations</h1>
  <p class="sub">Companion interactive figures for the ICSE&#39;27 study</p>
  <div class="cards">
    <a class="card" href="/evolution">
      <h2>Evolution &rarr;</h2>
      <p>Temporal view of the Solana vulnerability dataset.</p>
    </a>
    <a class="card" href="/landscape">
      <h2>Landscape &rarr;</h2>
      <p>Ecosystem-wide security landscape overview.</p>
    </a>
  </div>
</body>

</html>
